<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex box</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
    <nav class="burger-menu">
      <img src="Group 3.png" alt="Menu icon">
    </nav>
    <h1 class="page-title">Dashboard da @say.valente</h1>
  </header>

    
    <div class="layout">
        
        <!-- sidebar -->
        
        <aside class="sidebar">
            <div class="icons">
            <div class="Home-icon">
                <img src="Home icon (1).png" alt="Home">
            </div>
            <div class="search-icon">
                <img src="layers 1.png" alt="Search">
            </div>
            
            <div class="user-icon">
                <img src="layers 2.png" alt="User">
            </div>
            <div class="logout-icon">
                <img src="layers 3.png" alt="Logout">
            </div>
            <div class="calendar-icon">
                <img src="layers 4.png" alt="Calendar">
            </div>
            </div>
        </aside>
        <!-- boxes -->
     <main class="box-content">
        <section class="stats-cards">
        <article class="card"></article>
        <article class="card"></article>
        <article class="card"></article>
      </section>

      <section class="activity-box">
        <article class="card"></article>
      </section>

      <section class="bottom-boxes">
        <article class="card"></article>
        <article class="card"></article>
      </section>
    </main>


    <aside class="right-side">
        <figure class="rectangle-box">
          <img src="Group 1.png" alt="Dashboard illustration">
        </figure>
      <section class="empty-box"></section>
    </aside>

    
</body>
</html>
